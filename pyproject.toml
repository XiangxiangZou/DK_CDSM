[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dk-cdsm"
version = "0.1.0"
description = "Reusable Koopman control and cable-driven space manipulator research code"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "control*", "prediction*", "traj_data*", "visualization*"]
exclude = ["legacy_system*", "outputs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = [
    "archive",
    "outputs",
    ".git",
    ".pytest_cache",
    "__pycache__",
]
addopts = "-ra"
